services:
  web:
    build: .
    command: bash -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8008"
    restart: unless-stopped
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles
    env_file:
      - .env.eudy
    environment:
      USE_SQLITE: "false"
      # Eudy-only recovery overlay. The base/Ricardo compose is intentionally unchanged.
      EUDY_RECOVERY_ENABLED: "true"
      EUDY_RECOVERY_ACCOUNT_ALIASES: "eudy"
      EUDY_RECOVERY_BYPASS_STATIC_PROFILE: "true"
      EUDY_EDGE_GUARD_LOOKBACK_DAYS: "120"
      EUDY_EDGE_GUARD_MAX_TRADES: "60"
      EUDY_EDGE_GUARD_MIN_TRADES: "12"
      EUDY_EDGE_GUARD_MIN_PROFIT_FACTOR: "1.15"
      EUDY_EDGE_GUARD_MIN_EXPECTANCY_PCT: "0.0"
      EUDY_EDGE_GUARD_EXPLORATION_RISK_MULT: "0.50"
      EUDY_EDGE_GUARD_RESET_AT: "2026-04-30T00:00:00Z"
      MIN_QTY_RISK_ABSOLUTE_CAP_ENABLED: "true"
      MIN_QTY_RISK_ABSOLUTE_CAP_PCT: "0.003"
      EUDY_RECOVERY_FLAT_TIMEOUT_ENABLED: "true"
      EUDY_RECOVERY_FLAT_TIMEOUT_MINUTES: "120"
      EUDY_RECOVERY_FLAT_EARLY_EXIT_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A config worker -l info --concurrency=4 -Q trading,celery
    restart: unless-stopped
    volumes:
      - .:/app
    env_file:
      - .env.eudy
    environment:
      USE_SQLITE: "false"
      EUDY_RECOVERY_ENABLED: "true"
      EUDY_RECOVERY_ACCOUNT_ALIASES: "eudy"
      EUDY_RECOVERY_BYPASS_STATIC_PROFILE: "true"
      EUDY_EDGE_GUARD_LOOKBACK_DAYS: "120"
      EUDY_EDGE_GUARD_MAX_TRADES: "60"
      EUDY_EDGE_GUARD_MIN_TRADES: "12"
      EUDY_EDGE_GUARD_MIN_PROFIT_FACTOR: "1.15"
      EUDY_EDGE_GUARD_MIN_EXPECTANCY_PCT: "0.0"
      EUDY_EDGE_GUARD_EXPLORATION_RISK_MULT: "0.50"
      EUDY_EDGE_GUARD_RESET_AT: "2026-04-30T00:00:00Z"
      MIN_QTY_RISK_ABSOLUTE_CAP_ENABLED: "true"
      MIN_QTY_RISK_ABSOLUTE_CAP_PCT: "0.003"
      EUDY_RECOVERY_FLAT_TIMEOUT_ENABLED: "true"
      EUDY_RECOVERY_FLAT_TIMEOUT_MINUTES: "120"
      EUDY_RECOVERY_FLAT_EARLY_EXIT_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-data:
    build: .
    command: celery -A config worker -l info --concurrency=4 -Q marketdata,ml -n data@%h
    restart: unless-stopped
    volumes:
      - .:/app
    env_file:
      - .env.eudy
    environment:
      USE_SQLITE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A config beat -l info -s celerybeat-schedule-eudy
    restart: unless-stopped
    volumes:
      - .:/app
    env_file:
      - .env.eudy
    environment:
      USE_SQLITE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  market-data:
    build: .
    command: python manage.py marketdata_loop
    restart: unless-stopped
    volumes:
      - .:/app
    env_file:
      - .env.eudy
    environment:
      USE_SQLITE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-mastertrading_redis}
    volumes:
      - redis-data:/data
    command: sh -c 'redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"'
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  staticfiles:
